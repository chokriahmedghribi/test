name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK (installable without a signing key)
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/CodePostalTN-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CodePostalTN-apk
          path: dist/*.apk

      - name: Publish release (direct download link for the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: الترقيم البريدي التونسي v1.0.${{ github.run_number }}
          body: |
            حمّل ملف APK من الأسفل وثبّته على هاتف أندرويد (Android 8 فما فوق).
            قد يطلب الهاتف السماح بتثبيت التطبيقات من مصادر غير معروفة.
          files: dist/*.apk
